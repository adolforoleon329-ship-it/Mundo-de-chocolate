    <title>Chocolates</title>
</head>
<body>
    <h1><marquee><u>Chocolates que eu gosto</u></marquee></center></h1>
    <figure>
        <center><img src="imagens/sonho_de_valsa.png" alt="sonho de valsa" width="20%"></center>
        <figcaption><center><h3><i>Sonho de valsa</i></h3></figcaption></center>
        <figcaption><center><mark>O Sonho de Valsa tem uma casca de wafer crocante, 
            um recheio cremoso feito com pasta de amendoim e castanha-de-caju</mark></center></figcaption>
    </figure>

    <br>
    <hr color="brown" size="6">
    <figure>
        <center><img src="imagens/Ouro_branco.webp" alt="Ouro Branco" width="20%"></center>
        <figcaption><center><h3><i>Ouro Branco</i></h3></center></figcaption>
        <figcaption><center><mark>O Ouro Branco tem uma casca de wafer crocante e cobertura de chocolate branco,
            com um recheio cremoso de chocolate com flocos de arroz.</mark></center></figcaption>
    </figure>
    <br>
    <hr color="brown" size="6">

    <figure>
        <center><img src="imagens/Ferrero_Rocher.webp" alt="Ferrero Rocher" width="20%"></center>
        <figcaption><center><h3><i>Ferrero Rocher</i></h3></center></figcaption>
        <figcaption><center><mark>O Ferrero Rocher tem uma casca de wafer crocante coberta com chocolate ao leite e pedaços de avelã,
            recheio cremoso e uma avelã inteira no coração do bombom.</mark></center></figcaption>
    </figure>
    <br>
    <hr color="brown" size="6">

    <figure>
        <center><img src="imagens/Galak.webp" alt="Barra de chocolate Galak" width="20%"></center>
        <figcaption><center><h3><i>Galak</i></h3></center></figcaption>
        <figcaption><center><mark>A barra de Galak é feita inteiramente de chocolate branco macio,
             com um sabor marcante e adocicado que destaca o gosto pronunciado do leite.</mark></center></figcaption>
    </figure>
    <br>
    <hr color="brown" size="6">
    <figure>
        <center><img src="imagens/Brigadeiro.webp" alt="Brigadeiro de chocolate" width="20%"></center>
        <figcaption>
            <center><h3><i>Brigadeiro</i></h3></center>
        </figcaption>
        <figcaption>
            <center><mark>O brigadeiro é feito de leite condensado cozido com manteiga e chocolate em pó,
                enrolado em formato de bolinha e coberto com chocolate granulado</mark></center>
        </figcaption>
    </figure>
    <br>
    <hr color="brown" size="6">

    <center><img src="imagens/M&M.jpg" alt="chocolate m&m" width="20%"></center>
    <figcaption>
        <center>
            <h3><i>M&M</i></h3>
        </center>
    </figcaption>
    <figcation>
        <center>
            <mark>Os M&M's são pastilhas de chocolate ao leite com formato arredondado,
                cobertas por uma casquinha de açúcar colorida e crocante.</mark>
        </center>
    </figcation>

    <br>
    <hr color="brown" size="6">

    <figure>
        <center><img src="imagens/mini_bolo_vulcao.png" alt="Mini bolo vulcao de chocolate com leite ninho"></center>
        <figcaption><center><h3><i>Bolo vulcao de chocolate com leite ninho</i></h3></center></figcaption>
        <figcaption><center><mark>O bolo vulcão de chocolate com leite ninho traz uma massa fofinha de chocolate com um buraco central preenchido por um brigadeiro
            cremoso de Leite Ninho, que escorre como lava ao cortar a primeira fatia.</mark></center></figcaption>
    </figure>

    <br>
    <hr color="brown" size="6">

    <figure>
        <center><h2><strong>Extra</strong></h2></center>
        <center><img src="imagens/milkshake_brownie.png" alt="Milkshake de brownie de chocolate" width="20%"></center>
        <figcaption><center><h3><i>Milkshake de brownie de chocolate</i></h3></center></figcaption>
        <figcaption><center><mark>O milkshake de brownie combina sorvete cremoso de baunilha ou chocolate batido com leite,
             misturado a pedaços densos e fudgy de brownie e calda de chocolate.</mark></center></figcaption>
    </figure>
